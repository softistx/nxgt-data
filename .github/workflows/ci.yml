name: CI

on:
  pull_request:
    # `feat/**` too: an effort built with large-feature-branch-workflow merges
    # each slice into its integration branch `feat/<slug>`, and those slices
    # are merged without waiting for a human. Without this they merged with no
    # CI at all — no tests, no artifact check.
    branches: [develop, main, 'feat/**']
  # On `develop` as well, and the reason is the four caches below rather than
  # the tests. A cache written by a pull request is scoped to
  # `refs/pull/<N>/merge` and **no other branch can read it** — a pull request
  # reads its base branch's caches and the default branch's, never another
  # pull request's. With CI on `pull_request` alone, nothing was ever written
  # under `refs/heads/develop`, so every run started cold: mongod (122 MB),
  # Meilisearch, SeaweedFS and a Redis compiled from source, four downloads
  # and a build in parallel before a single test.
  #
  # Measured on 2026-09-20: 173 cache entries, seven separate copies of
  # mongod, one per pull request, and the only entry on `refs/heads/develop`
  # was `bun-`. The version pull request failed twice in a row under that
  # load — six migration specs timing out at 5 s the first time, the
  # change-stream one the second — while the identical tree had passed on the
  # feature pull request minutes earlier. Different tests each time, which is
  # load, not a regression.
  #
  # One run per merge into `develop` fills `refs/heads/develop`, and every
  # pull request after it starts warm. The minutes are free here, as the
  # `runs-on` comment says.
  push:
    branches: [develop]

jobs:
  ci:
    name: CI
    # GitHub-hosted: this repository is public, so the minutes are free and
    # unlimited.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint code
        run: biome ci
      # Build FIRST. Every package's `exports` points at `./dist/*`, so on a
      # clean checkout a package that imports a sibling resolves it to nothing
      # and typecheck reports phantom TS2307s. A developer's tree always has a
      # stale `dist/` lying around, which hides this locally — it only ever
      # shows up in CI. `bun run --filter` builds in dependency order, so
      # building from nothing works.
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # Per package, then the scripts' own specs. The specs run PostgreSQL in
      # process with PGlite: no service container, no Docker.
      # @nxgt/meilisearch's specs start the official Meilisearch binary, which
      # its `test` script downloads when it is missing. Cached, keyed on the
      # script that pins its version, so a run downloads it only once per
      # version.
      - name: Cache the Meilisearch binary
        uses: actions/cache@v4
        with:
          path: .cache/meilisearch
          key: meilisearch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/meilisearch.ts') }}
      # @nxgt/s3's specs start a real S3 API: SeaweedFS's gateway, one
      # binary from its GitHub releases. Not MinIO — it is archived and
      # publishes none any more; scripts/seaweedfs.ts says so.
      - name: Cache the SeaweedFS binary
        uses: actions/cache@v4
        with:
          path: .cache/seaweedfs
          key: seaweedfs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/seaweedfs.ts') }}
      # @nxgt/redis's specs start a real Redis, and @nxgt/redis-kit's,
      # @nxgt/redis-guard's and examples/hono-api's own copies of that server
      # start the same one. Nothing publishes a prebuilt
      # one — redis/redis and valkey both ship source only — so
      # redis-memory-server compiles it; packages/redis/test/server.ts has
      # what that costs. scripts/redis.ts does the build before the specs
      # run, so it never lands inside a test's timeout. All four copies are
      # hashed here: they pin the same REDIS_VERSION, and a change to any of
      # them is a different build.
      - name: Cache the Redis build
        uses: actions/cache@v4
        with:
          path: .cache/redis
          key: redis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/redis/test/server.ts', 'packages/redis-kit/test/server.ts', 'packages/redis-guard/test/server.ts', 'examples/hono-api/test/redis.ts', 'scripts/redis.ts') }}
      # @nxgt/mongo's specs start a real mongod, as a single-node replica set,
      # which is what transactions need. mongodb-memory-server downloads it on
      # the first start; the version is pinned in the file this key hashes.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb
          key: mongod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/mongo/test/server.ts', 'packages/mongo-meilisearch/test/mongo.ts', 'packages/mongo-kit/test/server.ts', 'packages/mongo-search-kit/test/mongo.ts', 'examples/hono-api/test/kit.ts') }}
      - name: Run tests
        run: bun run test
      # The build exits 0 on packages that throw the instant they are imported —
      # it happened three times in nxgt-core. This packs them, installs them as a consumer
      # does and imports every declared subpath.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # A change to a package without a changeset is a change that never
      # reaches a consumer: the release workflow has nothing to version.
      #
      # Except on the release branch itself. "Version packages" is the PR that
      # *consumes* the changesets: it rewrites every version, deletes the
      # `.changeset/*.md` that justified them, and so trips this check on its
      # own output. Requiring a changeset there would mean requiring one for
      # the act of releasing.
      #
      # And only on a pull request. On a push to `develop` the check compares
      # `develop` with `origin/develop`, which is an empty diff: measured on
      # changesets 3.0.3 it exits 0, so it cannot fail there — but it cannot
      # catch anything either, and a step that can only pass is one a reader
      # has to work out.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status
