  RateLimit-Remaining:
    $ref: ../headers/RateLimit-Remaining.yaml
  RateLimit-Reset:
    $ref: ../headers/RateLimit-Reset.yaml
  Retry-After:
    $ref: ../headers/Retry-After.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/Problem.yaml
