delete:
  tags:
    - articles
  summary: Take an article back. It is kept, with the time it was removed.
  operationId: deleteArticle
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '204':
      description: Removed.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  tags:
    - articles
  summary: Change an article.
  operationId: updateArticle
  parameters:
    - $ref: ../components/parameters/id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ArticlePatch.yaml
  responses:
    '200':
      description: The article, as it is now.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Article.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
